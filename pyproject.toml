[project]
name = "kalufs-kepubify"
version = "0.2.0"
readme = "README.md"
description = "Small FastAPI application for converting epub into kepub."
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115,<1.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff",
]

[tool.pyright]
typeCheckingMode = "standard"

[tool.ruff]
line-length = 120
output-format = "grouped"

[tool.ruff.lint.pydocstyle]
convention = "google"
